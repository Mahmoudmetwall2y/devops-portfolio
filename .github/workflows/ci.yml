name: Build portfolio

on:
  push:
    branches: [main, master, release/sanity-netlify]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm --prefix studio ci --include=dev
      - run: npm run cms:typecheck
      - run: npm run cms:build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
